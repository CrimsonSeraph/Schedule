# =============================================================================
# Schedule · macOS 桌面构建（arm64 / x64）
# -----------------------------------------------------------------------------
# 触发方式：
#   * workflow_dispatch —— 手动触发
#   * workflow_call     —— 由 release-all.yml 统一调用
#
# 参考：README.md「快速开始 / 构建」章节、docs/PACKAGING.md 第 3 节。
#
# 可选 secrets（缺失不报错，仅跳过签名/公证并输出 warning）：
#   APPLE_CERT_P12_BASE64  —— Developer ID Application 证书（.p12）base64
#   APPLE_CERT_PASSWORD    —— 上述 .p12 的口令
#   APPLE_TEAM_ID          —— Apple Team ID（签名与公证都需要）
#   APPLE_API_KEY_ID       —— App Store Connect API Key ID
#   APPLE_API_ISSUER_ID    —— App Store Connect API Issuer ID
#   APPLE_API_KEY_BASE64   —— App Store Connect API 私钥（AuthKey_XXX.p8）base64
#
# 约定：
#   1) 两个架构拆成矩阵：arm64 用 macos-latest，x64 用 macos-15-intel。
#      注意：GitHub 已下线 macos-13，Intel runner 现行标签是 macos-15-intel /
#      macos-26-intel；私有仓库若没有 Intel runner，可在 release-all 中关闭该腿。
#   2) 工程里用的是 add_executable（不是 qt_add_executable），macOS 默认不会产出
#      .app bundle；这里显式传 -DCMAKE_MACOSX_BUNDLE=ON 才能得到 Schedule.app，
#      macdeployqt / codesign / notarytool 都以 bundle 为对象。
#   3) 构建阶段关闭 Xcode 自动签名，统一在 macdeployqt 之后手工签名，
#      保证顺序为：编译 → 部署 Qt 框架 → 签名 → 打包 → 公证 → stapler。
#   4) sign / notarize 为“强制”开关：true 时缺少对应 secrets 直接失败；
#      false 时只要 secrets 齐全依然会签名/公证，缺失则跳过并输出 warning。
# =============================================================================
name: build-macos

on:
  workflow_dispatch:
    inputs:
      sign:
        description: '强制代码签名（true：缺少 Apple 证书 secrets 直接失败）'
        type: boolean
        default: false
      notarize:
        description: '强制公证（true：缺少 Apple API Key secrets 直接失败）'
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        description: '强制代码签名'
        type: boolean
        default: false
      notarize:
        description: '强制公证'
        type: boolean
        default: false
    secrets:
      APPLE_CERT_P12_BASE64:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      APPLE_API_KEY_BASE64:
        required: false

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.9.3'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  BUILD_DIR: build/macos
  # 相对构建目录的 .app 位置（Xcode 多配置生成器带 Release 子目录）
  APP_REL: build/macos/src/app/Release/Schedule.app

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            cmake_arch: arm64
            artifact: Schedule-macos-arm64
          - arch: x64
            runner: macos-15-intel
            cmake_arch: x86_64
            artifact: Schedule-macos-x64
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          # Qt 官方 macOS 桌面包为通用二进制（arm64 + x86_64）
          arch: clang_64
          dir: ${{ github.workspace }}/Qt
          # cache: true 内部即 actions/cache，按 os+版本+arch 缓存整个 Qt 安装目录
          cache: true
          cache-key-prefix: qt-macos-clang_64

      - name: 准备 ccache
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache >/dev/null 2>&1 || brew install ccache
          mkdir -p "$CCACHE_DIR"
          echo "QTDIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "Qt 套件目录：$QT_ROOT_DIR"
          ccache --version | head -1

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.arch }}-
            ccache-macos-

      - name: 配置 CMake（Xcode，Release，关闭测试与自检）
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats || true
          cmake -S . -B "$BUILD_DIR" -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QTDIR" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_MACOSX_BUNDLE=ON \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DCMAKE_XCODE_ATTRIBUTE_ENABLE_USER_SCRIPT_SANDBOXING=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=OFF \
            -DBUILD_SELFTEST=OFF

      - name: 编译
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --config Release --parallel "$(sysctl -n hw.ncpu)"
          ccache --show-stats || true
          test -d "$APP_REL" || { echo "::error title=未生成 .app::期望路径 $APP_REL"; ls -R "$BUILD_DIR/src/app" || true; exit 1; }

      - name: macdeployqt 部署 Qt 框架与 QML 模块
        shell: bash
        run: |
          set -euo pipefail
          "$QTDIR/bin/macdeployqt" "$APP_REL" \
            -qmldir=src/ui/qml \
            -appstore-compliant \
            -verbose=1
          # -appstore-compliant 会剔除 App Store 不允许的库；若只做 Developer ID 分发
          # 且遇到删库导致的运行问题，可去掉该参数（公证并不要求它）。
          du -sh "$APP_REL"

      - name: 检查 Apple secrets
        id: apple
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          FORCE_SIGN: ${{ inputs.sign }}
          FORCE_NOTARIZE: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          if [ -n "$CERT_B64" ] && [ -n "$CERT_PWD" ] && [ -n "$TEAM_ID" ]; then
            echo "cert_ready=true" >> "$GITHUB_OUTPUT"
            echo "已检测到 Apple 签名证书 secrets。"
          else
            echo "cert_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=跳过 macOS 签名::未配置 APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD / APPLE_TEAM_ID，产物为未签名 .app（首次打开需右键或用 xattr 去除隔离属性）。"
            if [ "$FORCE_SIGN" = "true" ]; then
              echo "::error title=缺少签名 secrets::inputs.sign=true 要求强制签名，但 Apple 证书 secrets 不完整。"
              exit 1
            fi
          fi
          if [ -n "$TEAM_ID" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$API_KEY_B64" ]; then
            echo "notary_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=跳过公证::未配置 APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_BASE64（或 TEAM_ID），本次不做 notarytool 公证。"
            if [ "$FORCE_NOTARIZE" = "true" ]; then
              echo "::error title=缺少公证 secrets::inputs.notarize=true 要求强制公证，但 Apple API Key secrets 不完整。"
              exit 1
            fi
          fi

      - name: 导入证书并签名 .app
        if: ${{ steps.apple.outputs.cert_ready == 'true' }}
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # 使用一次性临时钥匙串，job 结束前删除；证书与口令都不落盘到仓库目录
          KEYCHAIN="$RUNNER_TEMP/schedule-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/schedule-cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          printf '%s' "$CERT_B64" | openssl base64 -d -A > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # 允许 codesign 无交互访问私钥（否则 CI 上会卡在授权弹窗）
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error title=未找到可用签名身份::钥匙串中没有 Developer ID Application 证书"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "签名身份：$IDENTITY"

          # --deep 会递归签名内嵌框架与插件；--options runtime 启用强化运行时（公证必需），
          # --timestamp 申请可信时间戳，避免证书过期后签名失效。
          codesign --deep --force --options runtime --timestamp \
            --sign "$IDENTITY" "$APP_REL"
          codesign --verify --deep --strict --verbose=2 "$APP_REL"
          echo "签名校验通过。"
          # spctl 在 CI 上常因 Gatekeeper 状态受限，仅作信息输出，不作为失败条件
          spctl -a -vvv -t exec "$APP_REL" || echo "::notice title=spctl::未通过 assist 评估（公证前属正常）"

      - name: 生成 dmg 与公证用 zip
        shell: bash
        run: |
          set -euo pipefail
          ARCH='${{ matrix.arch }}'
          # 从 CMakeLists.txt 的 project(... VERSION x.y.z) 里取版本号
          VERSION="$(awk '$1 == "VERSION" && $2 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print $2; exit }' CMakeLists.txt)"
          VERSION="${VERSION:-1.0.0}"
          echo "SCHEDULE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist

          # dmg：适合分发给普通用户，可被 notarytool 公证并被 stapler 装订
          hdiutil create -volname "Schedule" -srcfolder "$APP_REL" \
            -ov -format UDZO "dist/Schedule-${VERSION}-macos-${ARCH}.dmg"
          # 公证用 zip：仅用于提交公证，最终分发 zip 会在 staple 之后再生成
          ditto -c -k --sequesterRsrc --keepParent "$APP_REL" "$RUNNER_TEMP/notarize.zip"
          ls -lh dist "$RUNNER_TEMP/notarize.zip"

      - name: notarytool 公证
        if: ${{ steps.apple.outputs.notary_ready == 'true' && steps.apple.outputs.cert_ready == 'true' }}
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          printf '%s' "$API_KEY_B64" | openssl base64 -d -A > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          for f in dist/*.dmg "$RUNNER_TEMP/notarize.zip"; do
            [ -e "$f" ] || continue
            echo "提交公证：$f"
            xcrun notarytool submit "$f" \
              --key "$KEY_PATH" \
              --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER_ID" \
              --wait
          done

      - name: stapler 装订公证票据
        if: ${{ steps.apple.outputs.notary_ready == 'true' && steps.apple.outputs.cert_ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # dmg 与 .app 可以装订票据；zip 不能装订，因此最终 zip 在装订之后重新生成
          for f in dist/*.dmg; do
            [ -e "$f" ] || continue
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
          done
          xcrun stapler staple "$APP_REL"
          xcrun stapler validate "$APP_REL"

      - name: 生成最终分发 zip
        shell: bash
        run: |
          set -euo pipefail
          ARCH='${{ matrix.arch }}'
          VERSION="${SCHEDULE_VERSION:-1.0.0}"
          # 在签名/装订之后打包，保证 zip 内的 .app 已完成签名与票据装订
          rm -f "dist/Schedule-${VERSION}-macos-${ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_REL" \
            "dist/Schedule-${VERSION}-macos-${ARCH}.zip"
          ls -lh dist

      - name: 生成 SHA256 校验和
        shell: bash
        run: |
          set -euo pipefail
          # 先在 dist 之外生成，避免把正在写入的校验和文件自己也统计进去
          SUMS="$RUNNER_TEMP/SHA256SUMS-macos-${{ matrix.arch }}.txt"
          ( cd dist && shasum -a 256 $(find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -exec basename {} \; | sort) ) > "$SUMS"
          cp "$SUMS" "dist/SHA256SUMS-macos-${{ matrix.arch }}.txt"
          cat "dist/SHA256SUMS-macos-${{ matrix.arch }}.txt"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: 清理钥匙串与临时证书
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          # 即便前面步骤失败也要清理：临时钥匙串 + 证书 + API 私钥
          if [ -n "${KEYCHAIN:-}" ] && security list-keychains -d user | grep -q "$KEYCHAIN"; then
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "${CERT_PATH:-}" "${NOTARY_KEY_PATH:-}"
          echo "清理完成。"

      - name: 构建摘要
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### macOS ${{ matrix.arch }} 构建结果"
            echo ""
            echo "- Qt 版本：${QT_VERSION}（clang_64 通用包，本次目标架构 ${{ matrix.cmake_arch }}）"
            echo "- 构建类型：Release（BUILD_TESTS=OFF / BUILD_SELFTEST=OFF）"
            echo "- 签名：${{ steps.apple.outputs.cert_ready == 'true' && '已执行' || '已跳过（未配置 secrets 或未强制）' }}"
            echo "- 公证：${{ steps.apple.outputs.notary_ready == 'true' && '已执行' || '已跳过（未配置 secrets 或未强制）' }}"
            echo "- 产物 artifact：\`${{ matrix.artifact }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
