# =============================================================================
# Schedule · iOS 构建（arm64，.ipa / 未签名 .xcarchive）
# -----------------------------------------------------------------------------
# 触发方式：
#   * workflow_dispatch —— 手动触发
#   * workflow_call     —— 由 release-all.yml 统一调用（默认关闭，iOS 分发门槛高）
#
# 参考：docs/PACKAGING.md 第 5 节。
#
# 可选 secrets（缺失不报错，仅构建未签名 .xcarchive 并输出 warning）：
#   APPLE_CERT_P12_BASE64              —— Apple Development / Distribution 证书（.p12）base64
#   APPLE_CERT_PASSWORD                —— 上述 .p12 的口令
#   APPLE_TEAM_ID                      —— Apple Team ID
#   APPLE_PROVISIONING_PROFILE_BASE64  —— .mobileprovision 描述文件 base64（Ad Hoc / Development）
#   APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_BASE64
#                                      —— App Store Connect API Key，用于 -allowProvisioningUpdates
#
# 重要提醒：
#   1) 不上架 App Store 时通常走 Ad Hoc / Development 分发，用户设备 UDID 必须已登记在
#      描述文件里，普通用户安装 IPA 门槛较高；
#   2) 仓库尚未提供 Info.plist / Bundle ID 配置，这里用输入参数 bundle_id 覆盖
#      PRODUCT_BUNDLE_IDENTIFIER，请确保与描述文件中的 App ID 一致；
#   3) 未配置证书 secrets 时只产出未签名 .xcarchive，不会生成 .ipa。
# =============================================================================
name: build-ios

on:
  workflow_dispatch:
    inputs:
      sign:
        description: '强制签名并导出 .ipa（true：缺少 Apple secrets 直接失败）'
        type: boolean
        default: false
      bundle_id:
        description: 'iOS Bundle Identifier（需与描述文件一致）'
        type: string
        required: false
        default: 'com.example.schedule'
      export_method:
        description: '导出方式：ad-hoc / development / app-store / enterprise'
        type: string
        required: false
        default: 'ad-hoc'
  workflow_call:
    inputs:
      sign:
        description: '强制签名并导出 .ipa'
        type: boolean
        default: false
      bundle_id:
        description: 'iOS Bundle Identifier'
        type: string
        default: 'com.example.schedule'
      export_method:
        description: '导出方式'
        type: string
        default: 'ad-hoc'
    secrets:
      APPLE_CERT_P12_BASE64:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_PROVISIONING_PROFILE_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      APPLE_API_KEY_BASE64:
        required: false

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.9.3'
  BUILD_DIR: build/ios
  ARCHIVE_PATH: build/ios/archive/Schedule.xcarchive

jobs:
  build:
    name: iOS arm64
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Qt ${{ env.QT_VERSION }}（iOS 套件）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          arch: ios
          dir: ${{ github.workspace }}/Qt
          # 安装 iOS 套件时该 action 会自动补装一份桌面 Qt 作为 host 工具链（QT_HOST_PATH）
          cache: true
          cache-key-prefix: qt-ios-ios

      - name: 导出 Qt 环境变量
        shell: bash
        run: |
          set -euo pipefail
          echo "QTDIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "Qt iOS 套件目录：$QT_ROOT_DIR"
          if [ -z "${QT_HOST_PATH:-}" ]; then
            echo "::error title=缺少 QT_HOST_PATH::install-qt-action 未提供 host Qt 路径，无法交叉编译 iOS"
            exit 1
          fi
          echo "QT_HOST_PATH=$QT_HOST_PATH" >> "$GITHUB_ENV"
          echo "host Qt：$QT_HOST_PATH"
          # 注意：QTDIR 是本步骤刚写进 GITHUB_ENV 的，下一步才可见；
          # 同一步骤内要用 QT_ROOT_DIR，否则 set -u 报 unbound variable。
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"

      - name: 检查 Apple secrets
        id: apple
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          FORCE_SIGN: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$CERT_B64" ]    || missing="$missing APPLE_CERT_P12_BASE64"
          [ -n "$CERT_PWD" ]    || missing="$missing APPLE_CERT_PASSWORD"
          [ -n "$TEAM_ID" ]     || missing="$missing APPLE_TEAM_ID"
          [ -n "$PROFILE_B64" ] || missing="$missing APPLE_PROVISIONING_PROFILE_BASE64"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "已检测到 iOS 签名所需 secrets。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=跳过 iOS 签名::缺少 secrets：$missing —— 本次只构建未签名 .xcarchive。"
            if [ "$FORCE_SIGN" = "true" ]; then
              echo "::error title=缺少签名 secrets::inputs.sign=true 要求强制签名，但 Apple secrets 不完整：$missing"
              exit 1
            fi
          fi

      - name: 导入证书与描述文件
        if: ${{ steps.apple.outputs.ready == 'true' }}
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # 一次性临时钥匙串，job 结束前删除
          KEYCHAIN="$RUNNER_TEMP/schedule-ios.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/ios-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/schedule.mobileprovision"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          printf '%s' "$CERT_B64" | openssl base64 -d -A > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 安装描述文件，并解析 UUID / Name / 签名身份供 xcodebuild 使用
          printf '%s' "$PROFILE_B64" | openssl base64 -d -A > "$PROFILE_PATH"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" -o "$PLIST"
          echo "PROFILE_UUID=$(plutil -extract UUID raw -o - "$PLIST")" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$(plutil -extract Name raw -o - "$PLIST")" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/$(plutil -extract UUID raw -o - "$PLIST").mobileprovision"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '{print $2; exit}')"
          echo "CODE_SIGN_IDENTITY_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "已导入签名身份：$IDENTITY"
          echo "已安装描述文件：$(plutil -extract Name raw -o - "$PLIST")"

      - name: 配置 CMake（Xcode + Qt iOS 工具链）
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$QTDIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_MACOSX_BUNDLE=ON \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DCMAKE_XCODE_ATTRIBUTE_ENABLE_USER_SCRIPT_SANDBOXING=NO \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}" \
            -DBUILD_TESTS=OFF \
            -DBUILD_SELFTEST=OFF

      - name: 定位 xcodeproj 与 scheme
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find "$BUILD_DIR" -maxdepth 2 -name '*.xcodeproj' | head -1)"
          if [ -z "$PROJECT" ]; then
            echo "::error title=未生成 Xcode 工程::找不到 .xcodeproj"
            ls -R "$BUILD_DIR" | head -50
            exit 1
          fi
          # CMake 需要 CMAKE_XCODE_GENERATE_SCHEME=ON 才会写出 scheme
          SCHEME="$(xcodebuild -list -project "$PROJECT" -json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin)["project"]; print((d.get("schemes") or d.get("targets") or ["Schedule"])[0])')"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "工程：$PROJECT ｜ scheme：$SCHEME"

      - name: xcodebuild archive
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          PROJECT='${{ steps.proj.outputs.project }}'
          SCHEME='${{ steps.proj.outputs.scheme }}'

          # App Store Connect API Key 仅用于 -allowProvisioningUpdates（可选）
          AUTH_ARGS=""
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$API_KEY_B64" ]; then
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$API_KEY_B64" | openssl base64 -d -A > "$NOTARY_KEY_PATH"
            chmod 600 "$NOTARY_KEY_PATH"
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
            AUTH_ARGS="-allowProvisioningUpdates -authenticationKeyPath $NOTARY_KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          fi

          if [ "${{ steps.apple.outputs.ready }}" = "true" ]; then
            # 手工签名：临时钥匙串中的身份 + 已安装的 Ad Hoc/Development 描述文件
            SIGN_ARGS="CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_IDENTITY=${CODE_SIGN_IDENTITY_NAME:-iPhone Developer} PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME} OTHER_CODE_SIGN_FLAGS=--keychain=${KEYCHAIN}"
          else
            # 未签名：仅产出 .xcarchive 供后续手工签名/归档使用
            SIGN_ARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= EXPANDED_CODE_SIGN_IDENTITY="
          fi

          # shellcheck disable=SC2086
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            $SIGN_ARGS $AUTH_ARGS

          test -d "$ARCHIVE_PATH" || { echo "::error title=归档失败::未生成 .xcarchive"; exit 1; }
          du -sh "$ARCHIVE_PATH"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' \
            "$ARCHIVE_PATH/Info.plist" || true

      - name: 导出 .ipa
        if: ${{ steps.apple.outputs.ready == 'true' }}
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ inputs.export_method }}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${CODE_SIGN_IDENTITY_NAME}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ inputs.bundle_id }}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          AUTH_ARGS=""
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then
            AUTH_ARGS="-allowProvisioningUpdates -authenticationKeyPath $NOTARY_KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          fi

          # shellcheck disable=SC2086
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath dist/ipa \
            $AUTH_ARGS

          VERSION="$(awk '$1 == "VERSION" && $2 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print $2; exit }' CMakeLists.txt)"
          VERSION="${VERSION:-1.0.0}"
          IPA="$(find dist/ipa -name '*.ipa' | head -1)"
          [ -n "$IPA" ] || { echo "::error title=未生成 .ipa::请检查 ExportOptions.plist、描述文件与 Bundle ID 是否匹配"; exit 1; }
          mv "$IPA" "dist/Schedule-${VERSION}-ios-arm64.ipa"
          ls -lh dist

      - name: 生成 SHA256 校验和
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if compgen -G "dist/*" > /dev/null; then
            ( cd dist && shasum -a 256 ./* > SHA256SUMS-ios-arm64.txt )
            cat dist/SHA256SUMS-ios-arm64.txt
          else
            echo "::warning title=无 .ipa::未签名构建只产出 .xcarchive，无独立校验和文件"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-ios-arm64
          # 已签名时上传 .ipa；未签名时上传 .xcarchive；两者都需要时一并上传
          path: |
            dist/*
            build/ios/archive/*.xcarchive
          if-no-files-found: error
          retention-days: 14

      - name: 清理钥匙串、证书与描述文件
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          # 无论成功失败都清理：描述文件、临时钥匙串、证书与 API 私钥
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [ -n "${KEYCHAIN:-}" ] && security list-keychains -d user | grep -q "$KEYCHAIN"; then
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "${CERT_PATH:-}" "${PROFILE_PATH:-}" "${NOTARY_KEY_PATH:-}"
          echo "清理完成。"

      - name: 构建摘要
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### iOS arm64 构建结果"
            echo ""
            echo "- Qt 版本：${QT_VERSION}（target=ios）"
            echo "- Bundle ID：\`${{ inputs.bundle_id }}\`，导出方式：\`${{ inputs.export_method }}\`"
            if [ "${{ steps.apple.outputs.ready }}" = "true" ]; then
              echo "- 产物：已签名 \`.ipa\`"
            else
              echo "- 产物：**未签名 .xcarchive**（未配置 Apple secrets）"
              echo "- 提醒：未签名归档无法直接安装；Ad Hoc 分发需要把设备 UDID 加入描述文件。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
